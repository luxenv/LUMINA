<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumina-1</title>
<style>
body{margin:0;background:#0b1020;color:#e8ecf7;font:16px system-ui,sans-serif}main{max-width:900px;margin:35px auto;padding:20px}
h1{margin:0}.sub{color:#9aa7c2;margin:6px 0 20px}#chat{min-height:430px;padding:18px;border:1px solid #293450;border-radius:14px;background:#10172b}
.msg{margin:10px 0;padding:12px 14px;border-radius:10px;white-space:pre-wrap}.user{background:#1a2948}.ai{background:#151e33}
form{display:flex;gap:10px;margin-top:14px}input{flex:1;padding:14px;border-radius:10px;border:1px solid #34405f;background:#0f1628;color:white}
button{padding:14px 20px;border:0;border-radius:10px}
</style></head><body><main><h1>Lumina-1</h1><div class="sub">Offline local AI • tools • knowledge • memory</div>
<div id="chat"><div class="msg ai">Lumina-1 is ready.</div></div><form id="form"><input id="input" placeholder="Talk to Lumina-1..." autocomplete="off"><button>Send</button></form>
<script>
const f=document.getElementById("form"),i=document.getElementById("input"),c=document.getElementById("chat");
function add(t,k){let d=document.createElement("div");d.className="msg "+k;d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight;return d}
f.onsubmit=async e=>{e.preventDefault();let m=i.value.trim();if(!m)return;add("You: "+m,"user");i.value="";let b=add("Lumina-1 is thinking...","ai");
try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m})});let x=await r.json();b.textContent="Lumina-1: "+(x.reply||x.error)}
catch(x){b.textContent="Error: "+x}};
</script></main></body></html>
